name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Code Quality & Syntax Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Root & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Backend Code
        run: |
          python -m compileall backend/
          echo "Syntax verification successful."

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "--> Navigating to project directory..."
            cd ~/VURN

            echo "--> Pulling latest changes from main branch..."
            git pull origin main

            echo "--> Updating Git submodules..."
            git submodule update --init --recursive --remote backend

            echo "--> Rebuilding and launching backend container..."
            docker compose -f docker-compose.yml down
            docker compose -f docker-compose.yml build backend
            docker compose -f docker-compose.yml up -d

            echo "--> Running database migrations..."
            docker compose -f docker-compose.yml exec -T backend python manage.py migrate --noinput

            echo "--> Pruning dangling Docker build cache..."
            docker image prune -f

            echo "--> Deployment finished successfully!"